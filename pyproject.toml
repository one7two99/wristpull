[project]
name = "wristpull"
version = "0.2.0"
description = "Collect wearable health data locally (Garmin Fenix via USB, Gadgetbridge via ADB), normalise it into SQLite and prepare it for analysis"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "fitdecode>=0.11.0",
    "polars>=2.1.0",
]

[project.scripts]
wristpull = "wristpull.cli:main"

[project.optional-dependencies]
tui = [
    "textual>=8",
]
coach = [
    "anthropic>=1",
]

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "pyflakes>=3.2",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wristpull"]

[tool.pytest.ini_options]
testpaths = ["tests"]
