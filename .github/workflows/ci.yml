# Lint and tests on the three native platforms. The tests are hardware-free (fakes for the
# phone, the watch and the band), so a green run proves the package installs and behaves on
# that OS, not that the devices are reachable there (docs/platforms.md).
name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
          enable-cache: true
      - name: Install shellcheck (Linux only; the test skips it elsewhere)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Install
        run: uv sync --frozen --all-extras --dev
      - name: Lint
        run: uv run pyflakes src tests
      - name: Test
        run: uv run pytest -q
