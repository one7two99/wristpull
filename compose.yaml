# wristpull in Docker: the web dashboard (web + caddy, always on), the device agent (agent, always on: runs the
# watch, phone and band jobs the dashboard enqueues) and the `cli` service for everything else on demand:
#   docker compose run --rm cli wristpull tui          (or the wrapper contrib/bin/wristpull)
# 1. cp .env.example .env and fill it in (UID/GID, paths; secret and password hash for the dashboard)
# 2. docker compose up -d --build                      (dashboard + agent)   docker compose build   (cli only)
# 3. open https://<laptop-ip>:8443 (install Caddy's root certificate on the phone once, see README)
name: wristpull

services:
  web:
    build: .
    image: wristpull:latest
    restart: unless-stopped
    # Exactly ONE worker (see Dockerfile CMD): do not scale this service or add workers.
    # No USB access here: this container is reachable from the network.
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    env_file: .env
    environment:
      # `wristpull serve` refuses to start without the password hash and warns without the secret.
      WRISTPULL_WEB_SECRET: ${WRISTPULL_WEB_SECRET:-}
      WRISTPULL_WEB_PASSWORD_HASH: ${WRISTPULL_WEB_PASSWORD_HASH:-}
      # Coach runs with Ollama: the host as seen from the container (see README before changing OLLAMA_HOST).
      WRISTPULL_OLLAMA_URL: ${WRISTPULL_OLLAMA_URL:-http://host.docker.internal:11434}
      # Coach API keys: taken from the shell that runs `docker compose up`, or from .env.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      # Read-write: coach runs, ratings, journal notes and workout files are written from the browser.
      - ${WRISTPULL_DATA:?set WRISTPULL_DATA in .env}:/data
      - ${WRISTPULL_CONFIG:?set WRISTPULL_CONFIG in .env}:/config/config.toml:ro
    extra_hosts:
      # Ollama on the host as http://host.docker.internal:11434 (never OLLAMA_HOST=0.0.0.0, see README).
      - "host.docker.internal:host-gateway"
    expose:
      - "8000"
    # No published port: the app is reachable only through Caddy.

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      WRISTPULL_SITE: ${WRISTPULL_SITE:-https://localhost:8443}
    ports:
      - "8443:8443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  agent:
    # The device agent: `wristpull agent` polls the job queue in the database (agent_jobs) that the dashboard
    # fills and runs each job with the rights of `cli` (USB, host network, Bluetooth over D-Bus). It is the only
    # way the browser reaches the devices; `web` itself stays without them. No ports, nothing listens
    # (the adb server inside binds 127.0.0.1:5037 on the host network, as for `cli`). Linux only, like `cli`.
    # Needs the AppArmor profile from contrib/apparmor (the setup script installs it); without it only this
    # service fails to start and the dashboard shows "device agent offline".
    build: .
    image: wristpull:latest
    restart: unless-stopped
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    group_add:
      - "${WRISTPULL_USB_GID:-46}"
    network_mode: host
    healthcheck:
      disable: true
    env_file: .env
    environment:
      WRISTPULL_IN_CONTAINER: "1"
      WRISTPULL_DATA_DIR: /data
      WRISTPULL_HOST_DATA_DIR: ${WRISTPULL_DATA:?set WRISTPULL_DATA in .env}
      WRISTPULL_CONFIG_FILE: /config/config.toml
      HOME: /home/wristpull
      LANG: C.UTF-8
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      WRISTPULL_STRAP_AUTHKEY: ${WRISTPULL_STRAP_AUTHKEY:-}
    volumes:
      - ${WRISTPULL_DATA:?set WRISTPULL_DATA in .env}:/data
      # Read-only here: the agent reloads the config for every job but never writes it.
      - ${WRISTPULL_CONFIG:?set WRISTPULL_CONFIG in .env}:/config/config.toml:ro
      - ${WRISTPULL_DATA:?set WRISTPULL_DATA in .env}/adb:/home/wristpull/.android
      - /dev/bus/usb:/dev/bus/usb
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /etc/localtime:/etc/localtime:ro
    device_cgroup_rules:
      - "c 189:* rmw"
    security_opt:
      - "apparmor:wristpull-cli"
    # A running job finishes its current file before the container stops (stop_grace_period covers an MTP transfer).
    stop_grace_period: 30s
    command: ["wristpull", "--config", "/config/config.toml", "agent"]

  cli:
    # Short-lived commands with USB access: docker compose run --rm cli wristpull <command>
    # The `agent` service above runs the same commands for the dashboard; both may open the watch, and the one
    # that comes second gets the "device busy" message (as the udev import unit and the morning script do today).
    # The cgroup rule grants access to EVERY USB device (c 189:*), acceptable for a command the user
    # starts, never for `web`. Linux only: Docker Desktop on macOS/Windows does not pass USB through.
    profiles: ["cli"]
    build: .
    image: wristpull:latest
    user: "${UID:?set UID in .env}:${GID:?set GID in .env}"
    # The group that may open the device nodes (contrib/udev sets GROUP="plugdev" for the watch;
    # Android phones get plugdev from the usual android udev rules). `getent group plugdev`.
    group_add:
      - "${WRISTPULL_USB_GID:-46}"
    stdin_open: true
    tty: true
    # Host network: Ollama stays on http://localhost:11434 as configured in config.toml ([coach] ollama_url).
    network_mode: host
    healthcheck:
      disable: true
    env_file: .env
    environment:
      WRISTPULL_IN_CONTAINER: "1"
      # The data directory is mounted at /data whatever [storage] data_dir says; the host path is shown
      # in messages ("open on the host: ...").
      WRISTPULL_DATA_DIR: /data
      WRISTPULL_HOST_DATA_DIR: ${WRISTPULL_DATA:?set WRISTPULL_DATA in .env}
      WRISTPULL_CONFIG_FILE: /config/config.toml
      HOME: /home/wristpull
      TERM: ${TERM:-xterm-256color}
      COLORTERM: ${COLORTERM:-}
      LANG: ${LANG:-C.UTF-8}
      EDITOR: ${EDITOR:-nano}
      VISUAL: ${VISUAL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The band's auth key for `pull strap`, like the API keys: from .env, never from the config file.
      WRISTPULL_STRAP_AUTHKEY: ${WRISTPULL_STRAP_AUTHKEY:-}
    volumes:
      - ${WRISTPULL_DATA:?set WRISTPULL_DATA in .env}:/data
      # Read-write: the TUI settings screen saves the config file.
      - ${WRISTPULL_CONFIG:?set WRISTPULL_CONFIG in .env}:/config/config.toml
      # adb keys (adbkey, adbkey.pub): seed once from ~/.android so the phone needs no new authorisation.
      - ${WRISTPULL_DATA:?set WRISTPULL_DATA in .env}/adb:/home/wristpull/.android
      # USB pass-through for the watch (MTP) and the phone (ADB); hot-plug works because the whole bus is mounted.
      - /dev/bus/usb:/dev/bus/usb
      # Bluetooth for `pull strap`: bleak talks to the host's bluetoothd over the system D-Bus (host network is
      # already on). The host user must be allowed to use BlueZ (the `bluetooth` group on Debian/Ubuntu).
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - /etc/localtime:/etc/localtime:ro
    device_cgroup_rules:
      - "c 189:* rmw"
    # Docker's default AppArmor profile denies the D-Bus calls bleak needs for Bluetooth. contrib/apparmor/
    # has that profile plus the system-bus rule; install it once (see its README). `web` keeps docker-default.
    security_opt:
      - "apparmor:wristpull-cli"
    command: ["wristpull", "--help"]

volumes:
  caddy_data:   # holds Caddy's local CA (root.crt): keep it, or phones must trust a new one
  caddy_config:
