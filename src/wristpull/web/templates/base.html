<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
<title>{% block title %}wristpull{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<script src="/static/vendor/htmx.min.js" defer></script>
{% block head %}{% endblock %}
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf }}"}'>
{% if logged_in %}
<div class="shell">
<nav class="nav" aria-label="{{ _('Pages') }}">
<a class="brand" href="/">wristpull</a>
<a href="/" {% if page == "today" %}aria-current="page"{% endif %}>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8"/></svg>
<span>{{ _("Today") }}</span></a>
<a href="/trends" {% if page == "trends" %}aria-current="page"{% endif %}>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18l5-6 4 3 8-9M15 6h5v5"/></svg>
<span>{{ _("Trends") }}</span></a>
<a href="/activities" {% if page == "activities" %}aria-current="page"{% endif %}>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>
<span>{{ _("Activities") }}</span></a>
<a href="/sleep" {% if page == "sleep" %}aria-current="page"{% endif %}>
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
<span>{{ _("Sleep") }}</span></a>
<form method="post" action="/logout" class="logout">
<input type="hidden" name="csrf" value="{{ csrf }}">
<button type="submit">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h10"/></svg>
<span>{{ _("Log out") }}</span></button>
</form>
</nav>
<main class="main">
{% block main %}{% endblock %}
</main>
</div>
{% else %}
{% block public %}{% endblock %}
{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
